name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]

env:
  BUILD_ASSISTANT_TOKEN: ${{ vars.BCTL_TOKEN }}
  BUILD_ASSISTANT_BACKEND: ${{ vars.BCTL_BACKEND }}
  PROJECT_NAME: ${{ vars.BCTL_PROJECT_NAME }}

jobs:
  build:
    runs-on: back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify build started
        uses: daniilsv/buildctl-cli@v1.0.0
        with:
          action: event
          token: ${{ env.BUILD_ASSISTANT_TOKEN }}
          backend: ${{ env.BUILD_ASSISTANT_BACKEND }}
          project: ${{ env.PROJECT_NAME }}
          status: started

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GIT_DOMAIN }}
          username: ci
          password: ${{ env.RUNNER_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GIT_DOMAIN }}/daniilsv/buildctl-back
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Register backend container
        uses: daniilsv/buildctl-cli@v1.0.0
        if: success()
        with:
          action: container
          token: ${{ env.BUILD_ASSISTANT_TOKEN }}
          backend: ${{ env.BUILD_ASSISTANT_BACKEND }}
          project: ${{ env.PROJECT_NAME }}
          image: ${{ env.GIT_DOMAIN }}/daniilsv/buildctl-back:${{ github.ref_name }}
          digest: ${{ steps.build-backend.outputs.digest }}

      - name: Notify build in_progress
        uses: daniilsv/buildctl-cli@v1.0.0
        with:
          action: event
          token: ${{ env.BUILD_ASSISTANT_TOKEN }}
          backend: ${{ env.BUILD_ASSISTANT_BACKEND }}
          project: ${{ env.PROJECT_NAME }}
          status: in_progress
          log: "Built backend image"

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GIT_DOMAIN }}/daniilsv/buildctl-front
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Register frontend container
        uses: daniilsv/buildctl-cli@v1.0.0
        if: success()
        with:
          action: container
          token: ${{ env.BUILD_ASSISTANT_TOKEN }}
          backend: ${{ env.BUILD_ASSISTANT_BACKEND }}
          project: ${{ env.PROJECT_NAME }}
          image: ${{ env.GIT_DOMAIN }}/daniilsv/buildctl-front:${{ github.ref_name }}
          digest: ${{ steps.build-frontend.outputs.digest }}

      - name: Notify build in_progress
        uses: daniilsv/buildctl-cli@v1.0.0
        with:
          action: event
          token: ${{ env.BUILD_ASSISTANT_TOKEN }}
          backend: ${{ env.BUILD_ASSISTANT_BACKEND }}
          project: ${{ env.PROJECT_NAME }}
          status: in_progress
          log: "Built frontend image"

      - name: Notify build success
        if: success()
        uses: daniilsv/buildctl-cli@v1.0.0
        with:
          action: event
          token: ${{ env.BUILD_ASSISTANT_TOKEN }}
          backend: ${{ env.BUILD_ASSISTANT_BACKEND }}
          project: ${{ env.PROJECT_NAME }}
          status: success

      - name: Notify build failed
        if: failure()
        uses: daniilsv/buildctl-cli@v1.0.0
        with:
          action: event
          token: ${{ env.BUILD_ASSISTANT_TOKEN }}
          backend: ${{ env.BUILD_ASSISTANT_BACKEND }}
          project: ${{ env.PROJECT_NAME }}
          status: failed
