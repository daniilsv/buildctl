name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GIT_DOMAIN }}
          username: ci
          password: ${{ env.RUNNER_TOKEN }}

      - name: Extract metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: registry.git.int.sktaurus.ru/daniilsv/buildctl-back
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=registry.git.int.sktaurus.ru/daniilsv/buildctl-back:latest
          cache-to: type=inline

  build-frontend:
    runs-on: back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GIT_DOMAIN }}
          username: ci
          password: ${{ env.RUNNER_TOKEN }}

      - name: Extract metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: registry.git.int.sktaurus.ru/daniilsv/buildctl-front
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=registry.git.int.sktaurus.ru/daniilsv/buildctl-front:latest
          cache-to: type=inline

  build-cli:
    runs-on: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Set up Go
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version: "1.25"

      - name: Build CLI for Linux AMD64
        run: |
          cd ./cli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o buildctl-linux-amd64 ./cmd/buildctl

      - name: Build CLI for Linux ARM64
        run: |
          cd ./cli
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o buildctl-linux-arm64 ./cmd/buildctl

      - name: Upload CLI artifact
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: buildctl-linux-amd64
          path: cli/buildctl-linux-amd64

      - name: Upload CLI artifact
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: buildctl-linux-arm64
          path: cli/buildctl-linux-arm64
