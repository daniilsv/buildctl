name: CI/CD Pipeline

on:
  push:
    branches: [prod, develop]

env:
  DOCKER_REGISTRY: git.int.sktaurus.ru/sd
  GO_VERSION: "1.24"

jobs:
  # Сборка и публикация Docker образов
  build-and-push:
    name: Build & Push Docker Images
    runs-on: back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GIT_DOMAIN }}
          username: ci
          password: ${{ env.RUNNER_TOKEN }}

      # Back service
      - name: Extract metadata for back
        id: meta-back
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GIT_DOMAIN }}/sd/sd_back
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push back
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: back-runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-back.outputs.tags }}
          labels: ${{ steps.meta-back.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # Notifier service
      - name: Extract metadata for notifier
        id: meta-notifier
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GIT_DOMAIN }}/sd/sd_notifier
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push notifier
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: notifier-runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-notifier.outputs.tags }}
          labels: ${{ steps.meta-notifier.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # Broker service
      - name: Extract metadata for broker
        id: meta-broker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GIT_DOMAIN }}/sd/sd_broker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push broker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: broker-runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-broker.outputs.tags }}
          labels: ${{ steps.meta-broker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # Integrations worker service
      - name: Extract metadata for integrations_worker
        id: meta-integrations_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GIT_DOMAIN }}/sd/sd_integrations_worker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push integrations_worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: integrations_worker-runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-integrations_worker.outputs.tags }}
          labels: ${{ steps.meta-integrations_worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # Деплой в development окружение
  deploy-dev:
    name: Deploy to Development
    runs-on: back
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Deploy to development
        run: |
          echo "Deploying to development environment..."
          # Отправляем webhook для перезагрузки compose stack
          curl -X POST ${{vars.DEV_WEBHOOK_URL}}

  # Деплой в production окружение
  deploy-prod:
    name: Deploy to Production
    runs-on: back
    needs: build-and-push
    if: github.ref == 'refs/heads/prod'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Здесь будет логика деплоя в prod окружение
          curl -X POST ${{vars.PROD_WEBHOOK_URL}}

  # Уведомления о статусе
  notify:
    name: Notify Status
    runs-on: back
    needs: [build-and-push]
    if: always()
    steps:
      - name: Notify on success
        if: needs.build-and-push.result == 'success'
        run: |
          echo "✅ Pipeline completed successfully"
          # Здесь можно добавить отправку уведомлений в Slack, Teams и т.д.

      - name: Notify on failure
        if: needs.build-and-push.result == 'failure'
        run: |
          echo "❌ Pipeline failed"
          # Здесь можно добавить отправку уведомлений об ошибках
