name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify build started
        run: |
          buildctl event \
            --token="${{ vars.BUILD_ASSISTANT_TOKEN }}" \
            --backend="${{ vars.BUILD_ASSISTANT_BACKEND }}" \
            --project="build-assistant" \
            --commit="${{ github.sha }}" \
            --branch="${{ github.ref_name }}" \
            --status="started"
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GIT_DOMAIN }}
          username: ci
          password: ${{ env.RUNNER_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GIT_DOMAIN }}/daniilsv/buildctl-back
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GIT_DOMAIN }}/daniilsv/buildctl-front
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build CLI for Linux AMD64
        run: |
          cd ./cli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o buildctl-linux-amd64 ./cmd/buildctl

      - name: Build CLI for Linux ARM64
        run: |
          cd ./cli
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o buildctl-linux-arm64 ./cmd/buildctl

      - name: Upload CLI artifact
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: buildctl-linux-amd64
          path: cli/buildctl-linux-amd64

      - name: Upload CLI artifact
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: buildctl-linux-arm64
          path: cli/buildctl-linux-arm64

      - name: Notify build success
        if: success()
        run: |
          buildctl event \
            --token="${{ vars.BUILD_ASSISTANT_TOKEN }}" \
            --backend="${{ vars.BUILD_ASSISTANT_BACKEND }}" \
            --project="build-assistant" \
            --commit="${{ github.sha }}" \
            --branch="${{ github.ref_name }}" \
            --status="success"
        continue-on-error: true

      - name: Notify build failed
        if: failure()
        run: |
          buildctl event \
            --token="${{ vars.BUILD_ASSISTANT_TOKEN }}" \
            --backend="${{ vars.BUILD_ASSISTANT_BACKEND }}" \
            --project="build-assistant" \
            --commit="${{ github.sha }}" \
            --branch="${{ github.ref_name }}" \
            --status="failed"
        continue-on-error: true

  deploy:
    runs-on: back
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deployment step - update docker-compose or pull images"
          # Здесь должна быть логика деплоя
          # Например: docker-compose pull && docker-compose up -d
          # или обновление через SSH/API
