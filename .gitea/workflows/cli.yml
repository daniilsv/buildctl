name: Build CLI
on:
  push:
    branches:
      - main
    paths:
      - 'cli/**'

jobs:
  build:
    strategy:
      matrix:
        os: [linux]
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build binary
        working-directory: ./cli
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o buildctl-${{ matrix.os }}-${{ matrix.arch }} ./cmd/buildctl
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: buildctl-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/buildctl-*

