version: '3.8'

services:
  app:
    image: git.int.sktaurus.ru/daniilsv/buildctl:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen/qwen3-235b-a22b-2507}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_PREFIX: ${S3_PUBLIC_PREFIX:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-3}
      PORT: 8080
    ports:
      - "3000:80"

