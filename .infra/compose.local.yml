version: '3.8'

services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: build_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: .infra/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/build_assistant?sslmode=disable
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen/qwen3-235b-a22b-2507}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_PREFIX: ${S3_PUBLIC_PREFIX:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      B24_WEBHOOK_URL: ${B24_WEBHOOK_URL:-}
      B24_API_KEY: ${B24_API_KEY:-}
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-3}
      PORT: 8080
    ports:
      - "3000:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

